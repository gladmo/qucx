[workspace]
resolver = "2"
members = [
    ".",
    "crates/qucx-core",
    "crates/qucx-tcp",
    "crates/qucx-websocket",
    "crates/qucx-kcp",
    "crates/qucx-quic",
    "crates/qucx-webtransport",
]

[package]
name = "qucx"
version = "0.1.0"
edition = "2021"

[features]
default = ["tcp", "websocket", "kcp", "quic", "webtransport"]
tcp = ["dep:qucx-tcp"]
websocket = ["dep:qucx-websocket"]
kcp = ["dep:qucx-kcp"]
quic = ["dep:qucx-quic"]
webtransport = ["dep:qucx-webtransport"]

[dependencies]
qucx-core = { path = "crates/qucx-core" }
qucx-tcp = { path = "crates/qucx-tcp", optional = true }
qucx-websocket = { path = "crates/qucx-websocket", optional = true }
qucx-kcp = { path = "crates/qucx-kcp", optional = true }
qucx-quic = { path = "crates/qucx-quic", optional = true }
qucx-webtransport = { path = "crates/qucx-webtransport", optional = true }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
bytes = "1"
quinn = { version = "0.11", features = ["rustls-ring"] }
rustls = { version = "0.23", features = ["ring"] }
kcp = "0.5"
wtransport = { version = "0.7", features = ["dangerous-configuration"] }

[[example]]
name = "echo_server"
path = "examples/echo_server.rs"

[[example]]
name = "tcp_client"
path = "examples/tcp_client.rs"

[[example]]
name = "ws_client"
path = "examples/ws_client.rs"

[[example]]
name = "quic_client"
path = "examples/quic_client.rs"

[[example]]
name = "kcp_client"
path = "examples/kcp_client.rs"

[[example]]
name = "webtransport_client"
path = "examples/webtransport_client.rs"
